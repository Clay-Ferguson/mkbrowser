# SAMPLE ONLY — nothing in the app ever reads this file.
#
# The live config lives in Electron's userData folder (see src/main/configMgr.ts):
#   Linux:   ~/.config/mk-browser/config.yaml
#   macOS:   ~/Library/Application Support/mk-browser/config.yaml
#   Windows: %APPDATA%\mk-browser\config.yaml
#
# This copy is checked in purely as a readable reference for the shape of that
# file — most usefully the `searchDefinitions` entries below, which are tedious to
# write from scratch. `browseFolder` is intentionally left empty: it is a
# machine-specific absolute path, and the app sets it for you when you pick a
# folder (or from a folder passed on the command line).
browseFolder: ''
settings:
  fontSize: medium
  sortOrder: alphabetical
  foldersOnTop: true
  ignoredPaths: ''
  searchDefinitions:
    - name: TODOs
      searchText: $("#todo")
      searchTarget: content
      searchMode: advanced
      searchBlock: file-lines
      sortBy: line-time
      sortDirection: desc
    - name: TODOs - Future
      searchText: $("#todo") && future(ts)
      searchTarget: content
      searchMode: advanced
      searchBlock: file-lines
      sortBy: line-time
      sortDirection: desc
    - name: TODOs - Future (Month)
      searchText: $("#todo") && future(ts, 31)
      searchTarget: content
      searchMode: advanced
      searchBlock: file-lines
      sortBy: line-time
      sortDirection: desc
    - name: TODOs - Future (Week)
      searchText: $("#todo") && future(ts, 7)
      searchTarget: content
      searchMode: advanced
      searchBlock: file-lines
      sortBy: line-time
      sortDirection: desc
    - name: TODOs - Past
      searchText: $("#todo") && past(ts)
      searchTarget: content
      searchMode: advanced
      searchBlock: file-lines
      sortBy: line-time
      sortDirection: desc
    - name: TODOs - Today
      searchText: $("#todo") && today(ts)
      searchTarget: content
      searchMode: advanced
      searchBlock: file-lines
      sortBy: line-time
      sortDirection: desc
    - name: TODOs - Future - P1
      searchText: $("#todo") && future(ts) && $("#p1")
      searchTarget: content
      searchMode: advanced
      searchBlock: file-lines
      sortBy: line-time
      sortDirection: desc
    - name: TODOs - Future - P1 (Week)
      searchText: $("#todo") && future(ts, 7) && $("#p1")
      searchTarget: content
      searchMode: advanced
      searchBlock: file-lines
      sortBy: line-time
      sortDirection: desc
    - name: TODOs - Future - P1 (Month)
      searchText: $("#todo") && future(ts, 31) && $("#p1")
      searchTarget: content
      searchMode: advanced
      searchBlock: file-lines
      sortBy: line-time
      sortDirection: desc
  contentWidth: full
  bookmarks: []
aiEnabled: true
